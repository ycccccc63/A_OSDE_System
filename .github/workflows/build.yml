name: Build Executable

on:
  push:
    tags:
      - 'v*' # 當 push 帶有 v 開頭的 tag (例如 v1.0.0) 時自動觸發打包與 Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "A_OSDE_System" A_OSDE_Sys.py

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path dist/A_OSDE_System/* -DestinationPath A_OSDE_System_Windows.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: A_OSDE_System_Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
